<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ead7ce" />
    <meta
      name="description"
      content="写给 Dr. Cao 的情人节书单与声音礼物。"
    />
    <title>To Dr. Cao · 一份只属于你的书单</title>
    <link rel="stylesheet" href="style.css?v=10" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="hero" aria-labelledby="page-title">
        <div class="hero__topline">
          <div class="dedication-wrap" aria-hidden="true">
            <img
              class="dedication"
              src="assets/images/to-dr-cao.webp"
              alt=""
              width="1200"
              height="685"
            />
          </div>

          <button class="intro-button" id="introButton" type="button">
            <span class="intro-button__icon" aria-hidden="true">🎧</span>
            <span>For U</span>
          </button>
        </div>

        <h1 class="hero-title" id="page-title">
          <img
            src="assets/images/valentines-day-title.png?v=1"
            alt="Valentine's Day"
            width="1200"
            height="764"
          />
          <span class="hero-title__fallback" aria-hidden="true">Valentine's Day</span>
        </h1>

        <p class="tagline">
          <span aria-hidden="true">✦</span>
          <span>一份只属于你的书单</span>
          <span aria-hidden="true">✦</span>
        </p>
        <p class="library-hint">点击对应书籍查收介绍</p>
      </header>

      <section class="library" aria-labelledby="library-title">
        <h2 class="sr-only" id="library-title">六本书</h2>
        <div class="book-grid" id="bookGrid"></div>
      </section>

      <section class="player-panel" id="playerPanel" aria-labelledby="trackTitle">
        <div class="player-panel__texture" aria-hidden="true"></div>

        <div class="now-playing">
          <div class="now-playing__art-frame" aria-hidden="true">
            <img id="trackArt" src="assets/images/wax-seal.webp" alt="" />
          </div>

          <div class="now-playing__copy">
            <p class="now-playing__eyebrow" id="trackKind">正在聆听</p>
            <h2 id="trackTitle">给你的礼物</h2>
            <p id="trackDescription">愿这些书陪你穿过时间去远方。</p>
          </div>
        </div>

        <div class="timeline">
          <div class="timeline__row">
            <span id="currentTime">0:00</span>
            <label class="sr-only" for="progressRange">音频播放进度</label>
            <input
              id="progressRange"
              class="progress-range"
              type="range"
              min="0"
              max="100"
              step="0.1"
              value="0"
              aria-valuetext="0:00"
            />
            <span id="duration">--:--</span>
          </div>
        </div>

        <div class="player-controls">
          <div class="transport" aria-label="播放控制">
            <button class="play-button" id="playButton" type="button" aria-label="播放">
              <span id="playIcon" aria-hidden="true">▶</span>
            </button>
          </div>

          <div class="speed-controls" aria-label="播放速度">
            <button class="speed-button is-active" type="button" data-speed="1" aria-pressed="true">1×</button>
            <button class="speed-button" type="button" data-speed="1.2" aria-pressed="false">1.2×</button>
            <button class="speed-button" type="button" data-speed="1.5" aria-pressed="false">1.5×</button>
            <button class="speed-button" type="button" data-speed="2" aria-pressed="false">2×</button>
          </div>
        </div>

        <audio id="audioPlayer" preload="metadata" src="assets/audio/intro.mp3"></audio>
        <p class="sr-only" id="playerStatus" aria-live="polite"></p>
      </section>

      <footer class="signature" aria-label="署名：by Qingyang">
        <img
          src="assets/images/signature.webp"
          alt="by Qingyang"
          width="1200"
          height="747"
        />
      </footer>
    </main>
  </body>
</html>
